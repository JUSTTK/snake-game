version: '3.8'

services:
  backend:
    image: ${BACKEND_IMAGE:-snake-game-backend}
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - SERVER_PORT=8081
    restart: unless-stopped
    networks:
      - snake-game-network

  frontend:
    image: ${FRONTEND_IMAGE:-snake-game-frontend}
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - snake-game-network

networks:
  snake-game-network:
    driver: bridge
