name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  backend-ci:
    name: Backend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download || go mod download

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: CGO_ENABLED=0 go build -a -installsuffix cgo -o server ./cmd/server

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline || npm ci --prefer-offline || npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  build-and-push:
    name: Build & Push Docker Images
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image names & branch tag
        id: meta
        shell: bash
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${REPO_LOWER}/snake-game-backend" >> $GITHUB_OUTPUT
          echo "frontend=ghcr.io/${REPO_LOWER}/snake-game-frontend" >> $GITHUB_OUTPUT
          RAW_BRANCH="${{ github.ref_name }}"
          SAFE_BRANCH=$(echo "$RAW_BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.branch }}
            ${{ steps.meta.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.branch }}
            ${{ steps.meta.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy (${{ github.ref_name }})
    needs: build-and-push
    runs-on: self-hosted
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute project name, ports & image names
        id: project
        shell: bash
        run: |
          BRANCH="${{ github.ref_name }}"
          SAFE_NAME=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9_-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "name=$SAFE_NAME" >> $GITHUB_OUTPUT

          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_image=ghcr.io/${REPO_LOWER}/snake-game-backend:${SAFE_NAME}" >> $GITHUB_OUTPUT
          echo "frontend_image=ghcr.io/${REPO_LOWER}/snake-game-frontend:${SAFE_NAME}" >> $GITHUB_OUTPUT

          if [ "$BRANCH" = "main" ]; then
            echo "backend_port=8081" >> $GITHUB_OUTPUT
            echo "frontend_port=80" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "develop" ]; then
            echo "backend_port=8082" >> $GITHUB_OUTPUT
            echo "frontend_port=8080" >> $GITHUB_OUTPUT
          else
            HASH=$(echo "$BRANCH" | cksum | cut -d' ' -f1)
            OFFSET=$((HASH % 100))
            echo "backend_port=$((9081 + OFFSET))" >> $GITHUB_OUTPUT
            echo "frontend_port=$((9000 + OFFSET))" >> $GITHUB_OUTPUT
          fi

      - name: Create .env file
        shell: bash
        run: |
          cat > .env << EOF
          BACKEND_IMAGE=${{ steps.project.outputs.backend_image }}
          FRONTEND_IMAGE=${{ steps.project.outputs.frontend_image }}
          GIN_MODE=release
          SERVER_PORT=8081
          BACKEND_PORT=${{ steps.project.outputs.backend_port }}
          FRONTEND_PORT=${{ steps.project.outputs.frontend_port }}
          EOF

      - name: Pull latest images
        run: docker compose pull

      - name: Deploy services
        run: |
          docker compose -p snake-game-${{ steps.project.outputs.name }} up -d --force-recreate --remove-orphans

      - name: Health check
        shell: bash
        run: |
          echo "Waiting for services to start..."
          sleep 8
          curl.exe -sf http://localhost:${{ steps.project.outputs.backend_port }}/health || echo "Backend health check endpoint not available (may not exist yet)"
          curl.exe -sf http://localhost:${{ steps.project.outputs.frontend_port }} || echo "Frontend health check failed"

      - name: Cleanup old images
        run: docker image prune -f
