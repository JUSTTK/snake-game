name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  backend-ci:
    name: Backend Lint, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download || go mod download

      - name: Go vet
        run: go vet ./...

      - name: Unit Tests
        run: go test ./... -v -coverprofile=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

      - name: Go build
        run: CGO_ENABLED=0 go build -a -installsuffix cgo -o server ./cmd/server

  frontend-ci:
    name: Frontend Lint, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline || npm ci --prefer-offline || npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npx vitest run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend E2E Tests
    needs: frontend-ci
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline || npm ci --prefer-offline || npm ci

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.44.1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  build-and-push:
    name: Build & Push Docker Images
    needs: [backend-ci, frontend-ci, frontend-e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image names & branch tag
        id: meta
        shell: bash
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${REPO_LOWER}/snake-game-backend" >> $GITHUB_OUTPUT
          echo "frontend=ghcr.io/${REPO_LOWER}/snake-game-frontend" >> $GITHUB_OUTPUT
          RAW_BRANCH="${{ github.ref_name }}"
          SAFE_BRANCH=$(echo "$RAW_BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.branch }}
            ${{ steps.meta.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.branch }}
            ${{ steps.meta.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy (${{ github.ref_name }})
    needs: build-and-push
    runs-on: self-hosted
    if: github.event_name == 'push'

    env:
      http_proxy: ${{ secrets.PROXY_URL }}
      https_proxy: ${{ secrets.PROXY_URL }}
      no_proxy: localhost,127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Docker proxy
        shell: pwsh
        run: |
          $proxyUrl = "${{ secrets.PROXY_URL }}"
          if ([string]::IsNullOrWhiteSpace($proxyUrl)) {
            Write-Host "No proxy configured, skipping"
            exit 0
          }
          $dockerConfigDir = "$env:USERPROFILE\.docker"
          if (-not (Test-Path $dockerConfigDir)) {
            New-Item -ItemType Directory -Path $dockerConfigDir -Force | Out-Null
          }
          $configPath = "$dockerConfigDir\config.json"
          $config = @{}
          if (Test-Path $configPath) {
            $config = Get-Content $configPath -Raw | ConvertFrom-Json -AsHashtable
          }
          if (-not $config.ContainsKey("proxies")) {
            $config["proxies"] = @{}
          }
          $config["proxies"]["default"] = @{
            "httpProxy"  = $proxyUrl
            "httpsProxy" = $proxyUrl
            "noProxy"    = "localhost,127.0.0.1"
          }
          $config | ConvertTo-Json -Depth 10 | Set-Content $configPath
          Write-Host "Docker proxy configured"

      - name: Compute project name, ports & image names
        id: project
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"
          $safeName = ($branch -replace '[^a-zA-Z0-9_-]', '-').ToLower()
          "name=$safeName" >> $env:GITHUB_OUTPUT

          $repoLower = "${{ github.repository }}".ToLower()
          "backend_image=ghcr.io/${repoLower}/snake-game-backend:${safeName}" >> $env:GITHUB_OUTPUT
          "frontend_image=ghcr.io/${repoLower}/snake-game-frontend:${safeName}" >> $env:GITHUB_OUTPUT

          if ($branch -eq "main") {
            "backend_port=8081" >> $env:GITHUB_OUTPUT
            "frontend_port=80" >> $env:GITHUB_OUTPUT
          } elseif ($branch -eq "develop") {
            "backend_port=8082" >> $env:GITHUB_OUTPUT
            "frontend_port=8080" >> $env:GITHUB_OUTPUT
          } else {
            $hash = $branch.GetHashCode() -band [int]::MaxValue
            $offset = $hash % 100
            "backend_port=$($offset + 9081)" >> $env:GITHUB_OUTPUT
            "frontend_port=$($offset + 9000)" >> $env:GITHUB_OUTPUT
          }

      - name: Create .env file
        shell: pwsh
        run: |
          @"
          BACKEND_IMAGE=${{ steps.project.outputs.backend_image }}
          FRONTEND_IMAGE=${{ steps.project.outputs.frontend_image }}
          GIN_MODE=release
          SERVER_PORT=8081
          BACKEND_PORT=${{ steps.project.outputs.backend_port }}
          FRONTEND_PORT=${{ steps.project.outputs.frontend_port }}
          "@ | Set-Content -Path .env -NoNewline

      - name: Pull latest images
        shell: pwsh
        run: |
          $maxRetries = 3
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Pull attempt $i of $maxRetries..."
            docker compose pull 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Pull succeeded"
              break
            }
            if ($i -lt $maxRetries) {
              Write-Host "Pull failed, waiting 10 seconds before retry..."
              Start-Sleep -Seconds 10
            } else {
              Write-Host "Pull failed after $maxRetries attempts"
              exit 1
            }
          }

      - name: Deploy services
        run: |
          docker compose -p snake-game-${{ steps.project.outputs.name }} up -d --force-recreate --remove-orphans

      - name: Health check
        shell: pwsh
        run: |
          Write-Host "Waiting for services to start..."
          Start-Sleep -Seconds 8
          try {
            Invoke-WebRequest -Uri "http://localhost:${{ steps.project.outputs.backend_port }}/health" -UseBasicParsing -TimeoutSec 5 | Out-Null
            Write-Host "Backend is healthy"
          } catch {
            Write-Host "Backend health check endpoint not available (may not exist yet)"
          }
          try {
            Invoke-WebRequest -Uri "http://localhost:${{ steps.project.outputs.frontend_port }}" -UseBasicParsing -TimeoutSec 5 | Out-Null
            Write-Host "Frontend is healthy"
          } catch {
            Write-Host "Frontend health check failed"
          }

      - name: Cleanup old images
        run: docker image prune -f
