name: CD

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches:
      - '**'

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/snake-game-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/snake-game-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sanitize branch name for Docker tag
        id: branch
        shell: bash
        run: |
          RAW="${{ github.event.workflow_run.head_branch }}"
          SAFE=$(echo "$RAW" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "name=$SAFE" >> $GITHUB_OUTPUT

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.branch.outputs.name }}
            ${{ env.BACKEND_IMAGE }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.branch.outputs.name }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy (${{ github.event.workflow_run.head_branch }})
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute project name & ports
        id: project
        shell: bash
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          SAFE_NAME=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9_-]/-/g')
          echo "name=$SAFE_NAME" >> $GITHUB_OUTPUT

          if [ "$BRANCH" = "main" ]; then
            echo "backend_port=8081" >> $GITHUB_OUTPUT
            echo "frontend_port=80" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "develop" ]; then
            echo "backend_port=8082" >> $GITHUB_OUTPUT
            echo "frontend_port=8080" >> $GITHUB_OUTPUT
          else
            HASH=$(echo "$BRANCH" | cksum | cut -d' ' -f1)
            OFFSET=$((HASH % 100))
            echo "backend_port=$((9081 + OFFSET))" >> $GITHUB_OUTPUT
            echo "frontend_port=$((9000 + OFFSET))" >> $GITHUB_OUTPUT
          fi

      - name: Create .env file
        shell: bash
        run: |
          cat > .env << EOF
          BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ steps.project.outputs.name }}
          FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ steps.project.outputs.name }}
          GIN_MODE=release
          SERVER_PORT=8081
          BACKEND_PORT=${{ steps.project.outputs.backend_port }}
          FRONTEND_PORT=${{ steps.project.outputs.frontend_port }}
          EOF

      - name: Pull latest images
        run: docker compose pull

      - name: Deploy services
        run: |
          docker compose -p snake-game-${{ steps.project.outputs.name }} up -d --force-recreate --remove-orphans

      - name: Health check
        shell: bash
        run: |
          echo "Waiting for services to start..."
          sleep 8
          curl.exe -sf http://localhost:${{ steps.project.outputs.backend_port }}/health || echo "Backend health check endpoint not available (may not exist yet)"
          curl.exe -sf http://localhost:${{ steps.project.outputs.frontend_port }} || echo "Frontend health check failed"

      - name: Cleanup old images
        run: docker image prune -f
